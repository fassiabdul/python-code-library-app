
services:
  db:
    image: abdulfassi/python:db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 100M

  auth_service:
    image: abdulfassi/python:auth
    ports:
      - "5001:5001"
    networks:
      - myapp
    depends_on:
      - db
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 100M

  book_service:
    image: abdulfassi/python:book
    ports:
      - "5002:5002"
    networks:
      - myapp
    depends_on:
      - db
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 100M

  borrow:
    image: abdulfassi/python:borrow
    ports:
      - "5003:5003"
    networks:
      - myapp
    depends_on:
      - db
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 100M

  frontend:
    image: abdulfassi/python:app
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 100M

networks:
  myapp:
    driver: overlay

volumes:
  mydata:
