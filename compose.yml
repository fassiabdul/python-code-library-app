services:
  db:
    conatainer_name: db
    build: abdulfassi/python:db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 100M
  auth_service:
    container_name: auth_service
    build: abdulfassi/python:auth
    ports:
      - "5001:5001"
    networks:
      - myapp
    depends-on:
      - db
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 100M

  book_service:
    container_name: book_service
    build: abdulfassi/python:book
    ports:
      - "5002:5002"
    depends-on:
      - db
    networks:
      - myapp
    deploy:
     resources:
       reservations:
         cpus: "0.5"
         memory: 100M
       limits:
         cpus: "0.5"
         memory: 100M

  borrow:
    container_name: borrow
    build: abdulfassi/python:borrow
    ports:
      - "5003:5003"
    networks:
      - myapp
    depends-on:
      - db
    deploy:
     resources:
       reservations:
         cpus: "0.5"
         memory: 100M
       limits:
         cpus: "0.5"
         memory: 100M
 frontend:
   container_name: frontend-cont
   build: abdulfassi/python:app
   ports:
     - "5000:5000"
   networks:
     - myapp
   depends-on:
     - db
   deploy:
     resources:
       reservations:
         cpus: "0.5"
         memory: 100M
       limits:
         cpus: "0.5"
         memory: 100M
network:
  myapp:
   driver: overlay

volumes:
  - mydata
